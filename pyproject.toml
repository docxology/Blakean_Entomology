[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blakean-entomology"
version = "0.1.0"
description = "A source-bound invertebrate concordance and research application of the Blake corpus"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Daniel Ari Friedman"}]
dependencies = ["blake>=0.2.0", "click>=8.1", "pydantic==2.11.9"]

[project.scripts]
blake-entomology = "blakean_entomology.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.11", "basedpyright>=1.28"]

[tool.uv.sources]
blake = {git = "https://github.com/docxology/blake", rev = "830f5b5dd197e43863374f5ea658b804fa816882"}
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"}

[tool.hatch.build.targets.wheel]
packages = ["src/blakean_entomology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001"]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["src"]
pythonVersion = "3.11"
# Inspect the pinned installed Blake source; its wheel has no py.typed marker.
extraPaths = ["src", ".venv/lib/python3.11/site-packages"]
