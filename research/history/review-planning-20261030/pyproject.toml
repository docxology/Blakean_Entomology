[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blakean-entomology"
version = "0.4.0"
description = "A source-bound invertebrate concordance and research application of the Blake corpus"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Daniel Ari Friedman"}]
dependencies = ["blake>=0.4.0", "click>=8.1", "pydantic==2.11.9"]

[project.scripts]
blake-entomology = "blakean_entomology.cli:main"

[project.optional-dependencies]
recovery = ["blake[recovery]>=0.4.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.11", "basedpyright>=1.28", "blake[recovery]>=0.4.0", "matplotlib>=3.7"]

[tool.uv.sources]
blake = {git = "https://github.com/docxology/blake.git", rev = "45171a099a6a658c52ab689501de646a28485653"}
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"}

[tool.hatch.build.targets.wheel]
packages = ["src/blakean_entomology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001"]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["src"]
pythonVersion = "3.11"
extraPaths = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "**/*.pyc", "/Blakean_Entomology.pdf"]
